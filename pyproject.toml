[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-agent"
version = "0.1.0"
description = "Agentic system for discovering, scoring, and applying to jobs with durable application tracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.118.0",
    "google-auth[requests]==2.58.0",
    "uvicorn[standard]==0.37.0",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "httpx==0.28.1",
    "isort==5.13.2",
    "mypy==1.13.0",
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
